          cat .bayside-autumn-theme-patch/*.b64 | tr -d '\r\n' | base64 --decode > /tmp/bayside-autumn-theme.patch.gz
          echo "e8361f7d72cb58115b82ee7c78686adc1969038a6c83c51815456ec011757da1  /tmp/bayside-autumn-theme.patch.gz" | sha256sum --check
