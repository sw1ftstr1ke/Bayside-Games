          gzip -d /tmp/bayside-loading-wave-owner-gradient.patch.gz
          patch --batch --forward -p1 < /tmp/bayside-loading-wave-owner-gradient.patch
          cat .bayside-wave-fill-fix/*.b64 | tr -d '\r\n' | base64 --decode > /tmp/bayside-wave-fill-fix.patch.gz
          echo "3a0ec7e7a3082f42dc3b870c10a4faacdb80cd92d3360043bc92b6382dff48da  /tmp/bayside-wave-fill-fix.patch.gz" | sha256sum --check
