          echo "588ca7f5e4fa9bc09f40cacfb74dadf4a7f0ca11bfcb09c2c7a557ce9cda949d  /tmp/drive-ai.patch.gz" | sha256sum --check
          gzip -d /tmp/drive-ai.patch.gz
          patch --batch --forward -p1 < /tmp/drive-ai.patch
          cat .collision-physics-patch/*.b64 | tr -d '\r\n' | base64 --decode > /tmp/collision-physics.patch.gz
          echo "e51aa55e6f464b31b65a01b5794567ddd3ba01b851f65a340b2729e3d7b8a22e  /tmp/collision-physics.patch.gz" | sha256sum --check
          gzip -d /tmp/collision-physics.patch.gz
          patch --batch --forward -p1 < /tmp/collision-physics.patch
          cat .launch-traffic-patch/*.b64 | tr -d '\r\n' | base64 --decode > /tmp/launch-traffic.patch.gz
          echo "7b51ce6ba1c1a965453043bd70bef9e420959274d2ee543a0e3c085a0f50c9dc  /tmp/launch-traffic.patch.gz" | sha256sum --check
          gzip -d /tmp/launch-traffic.patch.gz
          patch --batch --forward -p1 < /tmp/launch-traffic.patch
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apex-gp/src/main.js')
          source = path.read_text()
          old = '    body.bot.speed = Math.max(0, body.bot.speed * .88);'
          if source.count(old) != 1:
              raise SystemExit('Expected exactly one unconditional AI speed decay line')
          source = source.replace(old, '    // Position correction only; do not bleed speed when no collision occurred.', 1)
          if old in source:
