          cat .bayside-logo-unify-patch/*.b64 | tr -d '\r\n' | base64 --decode > /tmp/bayside-logo-unify.patch.gz
          echo "f822f1103cfe9d30ac43dca228239be1c6aebb4d4f5862f1c33ec0f605863547  /tmp/bayside-logo-unify.patch.gz" | sha256sum --check
