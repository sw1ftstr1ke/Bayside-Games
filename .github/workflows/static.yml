# Deploy the refined keyboard-first Apex GP simulator to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Reassemble, verify, and extract the refined simulator
        run: |
          cat .refined-parts/*.b64 | base64 --decode > /tmp/Apex-GP-Refined.zip
          echo "ba1272ac475124eb1583013134610ff452ecd816ffece9a94920d682471a10e2  /tmp/Apex-GP-Refined.zip" | sha256sum --check
          unzip -tq /tmp/Apex-GP-Refined.zip
          rm -rf apex-gp
          unzip -oq /tmp/Apex-GP-Refined.zip -d .
          rm -rf .refined-parts .monza-parts /tmp/Apex-GP-Refined.zip
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
