# Deploy the refined keyboard-first Apex GP simulator to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Reassemble, verify, and extract the refined simulator
        run: |
          cat .refined-parts/*.b64 | base64 --decode > /tmp/Apex-GP-Refined.zip
          echo "ba1272ac475124eb1583013134610ff452ecd816ffece9a94920d682471a10e2  /tmp/Apex-GP-Refined.zip" | sha256sum --check
          unzip -tq /tmp/Apex-GP-Refined.zip
          rm -rf apex-gp
          unzip -oq /tmp/Apex-GP-Refined.zip -d .
          mkdir -p /tmp/apex-gp-overrides
          base64 --decode .overrides.bundle.b64 | tar -xz -C /tmp/apex-gp-overrides
          cp -a /tmp/apex-gp-overrides/apex-gp/. apex-gp/
          patch --batch --forward -p1 < /tmp/apex-gp-overrides/overrides.patch
          python3 - <<'PY'
          from pathlib import Path
          path = Path("apex-gp/src/main.js")
          source = path.read_text()
          substitutions = [
              ("const steeringAngle = -carState.steer * maxSteerAngle;",
               "const steeringAngle = carState.steer * maxSteerAngle;"),
              ("const right = new THREE.Vector3(-forward.z, 0, forward.x);",
               "const right = new THREE.Vector3(forward.z, 0, -forward.x);"),
              ("+world-X is screen-left.", "+world-X is screen-right."),
              ("Camera-right is opposite world +X", "Camera-right follows +world-X"),
          ]
          for old, new in substitutions:
              if old in source:
                  source = source.replace(old, new)
              elif new not in source:
                  raise SystemExit(f"Expected coordinate token not found: {old}")
          if "const steeringAngle = carState.steer * maxSteerAngle;" not in source:
              raise SystemExit("Steering sign check failed")
          if "const right = new THREE.Vector3(forward.z, 0, -forward.x);" not in source:
              raise SystemExit("Camera side-vector check failed")
          path.write_text(source)
          PY
          for file in apex-gp/src/*.js; do node --check "$file"; done
          rm -rf /tmp/apex-gp-overrides .overrides.bundle.b64
          rm -rf .refined-parts .monza-parts /tmp/Apex-GP-Refined.zip
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
