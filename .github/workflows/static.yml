          PY
          grep -q "Position correction only" apex-gp/src/main.js
          grep -q "bot.gridLane" apex-gp/src/main.js
          cp .overlay-files/supabase-leaderboard.js apex-gp/src/supabase-leaderboard.js
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(source, old, new, label):
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return source.replace(old, new, 1)

          path = Path('apex-gp/src/main.js')
          source = path.read_text()
          source = replace_once(source,
              "import { SupabasePresence } from './supabase-presence.js';",
              "import { SupabasePresence } from './supabase-presence.js';\nimport { SupabaseLeaderboard } from './supabase-leaderboard.js';",
              'Supabase leaderboard import')
          source = replace_once(source,
              "let supabasePresence = null;",
              "let supabasePresence = null;\nlet supabaseLeaderboard = null;",
              'Supabase leaderboard instance')
          source = replace_once(source,
              "  globalPresence?.updateProfile({ name });\n  supabasePresence?.updateProfile({ name });",
              "  globalPresence?.updateProfile({ name });\n  supabasePresence?.updateProfile({ name });\n  supabaseLeaderboard?.updateProfile({ name });",
              'leaderboard display name updates')
          source = replace_once(source,
              "      const isGlobalBest = !wasCut && !!globalPresence?.recordLap(lap);",
              "      if (!wasCut) supabaseLeaderboard?.recordLap(lap).then(isGlobalBest => { if (isGlobalBest) toast('GLOBAL BEST · ' + formatTime(lap)); });\n      const isGlobalBest = false;",
              'persistent lap submission')
          import re
          callback_pattern = r"    leaderboard: entries => \{\n      globalLeaderboard = Array\.isArray\(entries\) \? entries : \[\];\n      renderGlobalLeaderboard\(\);\n    \},\n    status: status => \{\n      leaderboardSyncStatus = status \|\| 'CONNECTING';\n      // PeerJS remains responsible for lap-board relay only\. When Supabase is\n      // configured, its independent status drives the online-player panel\.\n      if \(!useSupabasePresence\) globalPresenceStatus = leaderboardSyncStatus;\n      renderOnlinePlayers\(\);\n      renderGlobalLeaderboard\(\);\n    \},"
          callback_replacement = "    status: status => {\n      if (!useSupabasePresence) globalPresenceStatus = status || 'CONNECTING';\n      renderOnlinePlayers();\n    },"
          source, callback_count = re.subn(callback_pattern, lambda _: callback_replacement, source, count=1)
          if callback_count != 1:
              raise SystemExit(f"remove PeerJS leaderboard callbacks: expected one match, found {callback_count}")
          source = replace_once(source,
              "  globalPresence.start(profile);\n  if (supabasePresence) supabasePresence.start(profile);",
              """  globalPresence.start(profile);
          if (supabasePresence) supabasePresence.start(profile);
          supabaseLeaderboard = new SupabaseLeaderboard({
            leaderboard: entries => {
              globalLeaderboard = Array.isArray(entries) ? entries : [];
              renderGlobalLeaderboard();
            },
            status: status => {
              leaderboardSyncStatus = status || 'CONNECTING';
              renderGlobalLeaderboard();
            }
          });
          supabaseLeaderboard.start(profile);""",
              'start persistent leaderboard')
          lines = source.splitlines()
          index = next((i for i, line in enumerate(lines) if 'leaderboard-empty' in line and 'CONNECTING TO THE GLOBAL TIMING BOARD' in line), -1)
          if index < 0:
              raise SystemExit('leaderboard empty-state line not found')
          lines[index:index + 1] = [
              "    const emptyMessage = leaderboardSyncStatus === 'SETUP_REQUIRED' ? 'DATABASE SETUP REQUIRED — RUN THE SUPABASE LEADERBOARD MIGRATION.' : online ? 'NO CLEAN LAPS YET — SET THE FIRST BENCHMARK.' : 'CONNECTING TO THE GLOBAL TIMING BOARD…';",
              "    body.innerHTML = '<tr><td colspan=\"4\" class=\"leaderboard-empty\">' + emptyMessage + '</td></tr>';"
          ]
          path.write_text('\n'.join(lines) + '\n')
          PY
          grep -q "new SupabaseLeaderboard" apex-gp/src/main.js
          grep -q "submit_apex_gp_lap" apex-gp/src/supabase-leaderboard.js
          echo "Persistent Supabase leaderboard integration applied"
          cat .camera-barrier-driving-patch/*.b64 | tr -d '\r\n' | base64 --decode > /tmp/camera-barrier-driving.patch.gz
          echo "72458fdc292d1d941427775d0170dfe2e806b6c0c053face7a4115aff5548587  /tmp/camera-barrier-driving.patch.gz" | sha256sum --check
          gzip -d /tmp/camera-barrier-driving.patch.gz
          patch --batch --forward -p1 < /tmp/camera-barrier-driving.patch
          grep -q "const followDistance = 10.8" apex-gp/src/main.js
          grep -q "const brakeForce = brake \* 52000" apex-gp/src/main.js
          grep -q "function barrierOffsetAt" apex-gp/src/track.js
          ! grep -q "barrierIsInsideTightTurn" apex-gp/src/track.js
          echo "Lower chase camera, continuous barriers, and responsive steering/braking applied"
          grep -q "current track frame" apex-gp/src/main.js
          echo "Collision response, safe launch lanes, and local contact resolution applied"
          for file in apex-gp/src/*.js apex-gp/src/*.mjs apex-gp/tests/*.mjs; do node --check "$file"; done
          node apex-gp/tests/race-math.test.mjs
          node apex-gp/tests/room-network.test.mjs
          rm -f apex-gp/src/main.js.orig apex-gp/src/main.js.rej
          rm -rf .room-owner-grid-patch /tmp/room-owner-grid.patch.gz /tmp/room-owner-grid.patch
          rm -rf .drive-ai-patch /tmp/drive-ai.patch.gz /tmp/drive-ai.patch
          rm -rf .collision-physics-patch /tmp/collision-physics.patch.gz /tmp/collision-physics.patch
          rm -rf .launch-traffic-patch /tmp/launch-traffic.patch.gz /tmp/launch-traffic.patch
          rm -rf .camera-barrier-driving-patch /tmp/camera-barrier-driving.patch.gz /tmp/camera-barrier-driving.patch
          rm -rf .bayside-autumn-theme-patch /tmp/bayside-autumn-theme.patch.gz /tmp/bayside-autumn-theme.patch
          rm -rf .bayside-wave-fill-fix /tmp/bayside-wave-fill-fix.patch.gz /tmp/bayside-wave-fill-fix.patch
          rm -f Apex-GP.zip
          zip -qr Apex-GP.zip apex-gp
          unzip -tq Apex-GP.zip
          rm -rf /tmp/apex-gp-overrides /tmp/main-update.patch .overrides.bundle.b64 .main.patch.gz.b64 .overlay-files .track-camera-patch /tmp/track-camera.patch .driving-update-patch /tmp/driving-update.patch.gz /tmp/driving-update.patch .launcher-braking-patch /tmp/launcher-braking.patch.gz /tmp/launcher-braking.patch .online-players-patch /tmp/online-players.patch.gz /tmp/online-players.patch .player-panel-layout-patch /tmp/player-panel-layout.patch.gz /tmp/player-panel-layout.patch .global-presence-patch /tmp/global-presence.patch.gz /tmp/global-presence.patch
          rm -rf .sector-timing-environment-patch /tmp/sector-timing-environment.patch.b64 /tmp/sector-timing-environment.patch.gz /tmp/sector-timing-environment.patch
          rm -rf .visual-upgrade-patch /tmp/visual-upgrade.patch.gz /tmp/visual-upgrade.patch
          rm -rf .leaderboard-room-patch /tmp/leaderboard-room.patch.gz /tmp/leaderboard-room.patch
          rm -rf .ers-tyres-pit-patch /tmp/ers-tyres-pit.patch.gz /tmp/ers-tyres-pit.patch
          rm -rf .sunny-loader-patch /tmp/sunny-loader.patch.gz /tmp/sunny-loader.patch
          rm -rf .supabase-presence-patch /tmp/supabase-presence.patch.gz /tmp/supabase-presence.patch
          rm -rf .supabase-config-patch /tmp/supabase-config.patch.gz /tmp/supabase-config.patch
          rm -rf .bayside-gp-nav-patch /tmp/bayside-gp-nav.patch.gz /tmp/bayside-gp-nav.patch
          rm -rf .race-setup-sidebar-patch .race-setup-sidebar-patch-v2 .race-setup-sidebar-patch-v3 .race-setup-sidebar-patch-final /tmp/race-setup-sidebar.patch.gz /tmp/race-setup-sidebar.patch
          rm -rf .bayside-brand-layout-patch /tmp/bayside-brand-layout.patch.gz /tmp/bayside-brand-layout.patch
          rm -rf .bayside-logo-unify-patch /tmp/bayside-logo-unify.patch.gz /tmp/bayside-logo-unify.patch
          rm -rf .bayside-loading-wave-owner-gradient /tmp/bayside-loading-wave-owner-gradient.patch.gz /tmp/bayside-loading-wave-owner-gradient.patch
          rm -rf .room-network-patch /tmp/room-network.patch.gz /tmp/room-network.patch
          rm -rf .owner-crown-patch /tmp/owner-crown.patch.gz /tmp/owner-crown.patch
          rm -rf .owner-card-ui-patch /tmp/owner-card-ui.patch.gz /tmp/owner-card-ui.patch
          rm -rf .refined-parts /tmp/Apex-GP-Refined.zip
