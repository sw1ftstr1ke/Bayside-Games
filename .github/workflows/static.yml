          echo "0d8c3e3dc467de45cd1d9debf9d4cb99036c81e8a53415a1cc372833fe1731ca  /tmp/room-network.patch.gz" | sha256sum --check
          gzip -d /tmp/room-network.patch.gz
          patch --batch --forward -p1 < /tmp/room-network.patch
          cat .owner-crown-patch/*.b64 | base64 --decode > /tmp/owner-crown.patch.gz
          echo "751652c219d77a2b67abb14aa0ae81716b9c5095d14a871feb27a21309826e04  /tmp/owner-crown.patch.gz" | sha256sum --check
          gzip -d /tmp/owner-crown.patch.gz
          patch --batch --forward -p1 < /tmp/owner-crown.patch
          cat .owner-card-ui-patch/*.b64 | base64 --decode > /tmp/owner-card-ui.patch.gz
          echo "b92c124b975463d19797ea430fb505557c67cd8eb908e8df25ca3cc2ab16efa5  /tmp/owner-card-ui.patch.gz" | sha256sum --check
          gzip -d /tmp/owner-card-ui.patch.gz
          patch --batch --forward -p1 < /tmp/owner-card-ui.patch
          cat .bayside-gp-nav-patch/*.b64 | base64 --decode > /tmp/bayside-gp-nav.patch.gz
          echo "17944abb229e8138f806e449a1200c8f1089d33719edf1b6344b4c8d13afbfb6  /tmp/bayside-gp-nav.patch.gz" | sha256sum --check
          gzip -d /tmp/bayside-gp-nav.patch.gz
          patch --batch --forward -p1 < /tmp/bayside-gp-nav.patch
          mkdir -p assets
          cat .race-setup-sidebar-patch-v3/*.b64 | tr -d '\r\n' | base64 --decode > /tmp/race-setup-sidebar.patch.gz
          echo "725e2af49adb7d229afd9bd833adb3a62660394761d03f9ee0d950a5eec653f8  /tmp/race-setup-sidebar.patch.gz" | sha256sum --check
          gzip -d /tmp/race-setup-sidebar.patch.gz
