# Deploy the tested, improved Apex GP simulator to GitHub Pages
name: Deploy static content to Pages
run-name: Publish Apex GP simulator build

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Reassemble, overlay, and test the simulator
        run: |
          cat .refined-parts/*.b64 | base64 --decode > /tmp/Apex-GP-Refined.zip
          echo "ba1272ac475124eb1583013134610ff452ecd816ffece9a94920d682471a10e2  /tmp/Apex-GP-Refined.zip" | sha256sum --check
          unzip -tq /tmp/Apex-GP-Refined.zip
          rm -rf apex-gp
          unzip -oq /tmp/Apex-GP-Refined.zip -d .
          mkdir -p /tmp/apex-gp-overrides
          base64 --decode .overrides.bundle.b64 | tar -xz -C /tmp/apex-gp-overrides
          cp -a /tmp/apex-gp-overrides/apex-gp/. apex-gp/
          patch --batch --forward -p1 < /tmp/apex-gp-overrides/overrides.patch
          base64 --decode .main.patch.gz.b64 | gzip -d > /tmp/main-update.patch
          patch --no-backup-if-mismatch --batch --forward -p1 < /tmp/main-update.patch || true
          python3 - <<'PY'
          from pathlib import Path
          path = Path("apex-gp/src/main.js")
          source = path.read_text()
          helper_import = "import { steeringAngleFromInput, cameraRightFromForward, shouldJudgeExcursion, evaluateExcursion } from './race-math.mjs';"
          if helper_import not in source:
              anchor = "import { TEAMS, createRacerCar, gridSlotPose, placeRacerOnTrack } from './opponents.js';"
              if anchor not in source:
                  raise SystemExit("Could not find the vehicle import anchor")
              source = source.replace(anchor, anchor + chr(10) + helper_import)
          # Replace the entire old steering block regardless of its old +/- sign.
          speed_line = source.find("const speedRatio = clamp(speed /")
          if speed_line < 0:
              speed_line = source.find("const maxSteerAngle = lerp(")
          if speed_line < 0:
              raise SystemExit("Could not locate the steering block")
          start = source.rfind("  // Keyboard polarity", 0, speed_line)
          if start < 0:
              start = source.rfind("  // The camera follows", 0, speed_line)
          if start < 0:
              start = source.rfind("  const speedRatio", 0, speed_line)
          end = source.find("  const wheelbase = 3.42;", speed_line)
          if start < 0 or end < 0:
              raise SystemExit("Could not bound the steering block")
          steering = """  // Three.js looks forward along +Z; screen-right is world -X.
          // A/left therefore creates positive world yaw and D/right negative yaw.
          const speedRatio = clamp(speed / 108, 0, 1);
          const maxSteerAngle = lerp(.62, .25, speedRatio);
          const steeringAngle = steeringAngleFromInput(carState.steer, maxSteerAngle);
          """
          source = source[:start] + steering + source[end:]
          # Align every TV/chase camera lateral offset with the same view-space basis.
          lines = source.splitlines()
          camera_fixed = False
          for i, line in enumerate(lines):
              if line.strip().startswith("const right = new THREE.Vector3("):
                  lines[i:i + 1] = [
                      "  const rightXZ = cameraRightFromForward(forward.x, forward.z);",
                      "  const right = new THREE.Vector3(rightXZ.x, 0, rightXZ.z);"
                  ]
                  camera_fixed = True
                  break
              if "cameraRightFromForward(forward.x, forward.z)" in line:
                  camera_fixed = True
                  break
          source = "\n".join(lines) + "\n"
          if not camera_fixed:
              raise SystemExit("Could not normalize the camera side vector")
          source = source.replace(
              "ctx.beginPath(); ctx.moveTo(0, -6); ctx.lineTo(4, 5); ctx.lineTo(0, 3); ctx.lineTo(-4, 5); ctx.closePath(); ctx.fill(); ctx.restore();",
              "ctx.beginPath(); ctx.moveTo(0, 6); ctx.lineTo(4, -5); ctx.lineTo(0, -2); ctx.lineTo(-4, -5); ctx.closePath(); ctx.fill(); ctx.restore();"
          )
          if "steeringAngleFromInput(carState.steer, maxSteerAngle)" not in source:
              raise SystemExit("Steering sign verification failed")
          if "cameraRightFromForward(forward.x, forward.z)" not in source:
              raise SystemExit("Camera direction verification failed")
          path.write_text(source)
          PY
          rm -f apex-gp/src/main.js.rej apex-gp/src/main.js.orig
          mkdir -p apex-gp/src apex-gp/tests
          cp .overlay-files/race-math.mjs apex-gp/src/race-math.mjs
          cp .overlay-files/race-math.test.mjs apex-gp/tests/race-math.test.mjs
          cat .track-camera-patch/*.b64 | base64 --decode > /tmp/track-camera.patch.gz
          echo "3b7989ce5a97c0b3c141133c0aaece02d1d1c312ce36e92d98b2a0e75b509f0e  /tmp/track-camera.patch.gz" | sha256sum --check
          gzip -d /tmp/track-camera.patch.gz
          patch --batch --forward -p1 < /tmp/track-camera.patch
          cat .driving-update-patch/*.b64 | base64 --decode > /tmp/driving-update.patch.gz
          echo "20c05663873e9d30c3f5937afffc34be27256e222763803349b829e0b795e01c  /tmp/driving-update.patch.gz" | sha256sum --check
          gzip -d /tmp/driving-update.patch.gz
          patch --batch --forward -p1 < /tmp/driving-update.patch
          cat .launcher-braking-patch/*.b64 | base64 --decode > /tmp/launcher-braking.patch.gz
          echo "f2fa9cd2a8cfe0021f736659a658adc4f192b61e6a61d215773d9a54a7a28eb1  /tmp/launcher-braking.patch.gz" | sha256sum --check
          gzip -d /tmp/launcher-braking.patch.gz
          patch --batch --forward -p1 < /tmp/launcher-braking.patch
          cat .online-players-patch/*.b64 | base64 --decode > /tmp/online-players.patch.gz
          echo "8f39c2a15c963d782425193d9c551bf4b835056ac5862093dc60a7a7cfd48d24  /tmp/online-players.patch.gz" | sha256sum --check
          gzip -d /tmp/online-players.patch.gz
          patch --batch --forward -p1 < /tmp/online-players.patch
          cat .player-panel-layout-patch/*.b64 | base64 --decode > /tmp/player-panel-layout.patch.gz
          echo "a2bd77cf8947bbb281bdb57e6c28597ca07fdcb26d6569b6a3a0c73cb34a1fd5  /tmp/player-panel-layout.patch.gz" | sha256sum --check
          gzip -d /tmp/player-panel-layout.patch.gz
          patch --batch --forward -p1 < /tmp/player-panel-layout.patch
          cat .global-presence-patch/*.b64 | base64 --decode > /tmp/global-presence.patch.gz
          echo "8f4647fe360f76103b902d107c95267280507047fd355f27e58dd90fc721c001  /tmp/global-presence.patch.gz" | sha256sum --check
          gzip -d /tmp/global-presence.patch.gz
          patch --batch --forward -p1 < /tmp/global-presence.patch
          cp .sector-timing-environment-patch/00.b64 /tmp/sector-timing-environment.patch.b64
          base64 --decode /tmp/sector-timing-environment.patch.b64 > /tmp/sector-timing-environment.patch.gz
          echo "68dbe6586f2e6c75e20609354ac931079ca16a2bd26b87f2ed8c38ba24b0ffe2  /tmp/sector-timing-environment.patch.gz" | sha256sum --check
          gzip -d /tmp/sector-timing-environment.patch.gz
          patch --batch --forward -p1 < /tmp/sector-timing-environment.patch
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(source, old, new, label):
              count = source.count(old)
              return source.replace(old, new, 1)

          nl = chr(10)
          gpath = Path('apex-gp/src/global-presence.js')
          g = gpath.read_text()
          peer_options = nl.join([
              "const PEER_OPTIONS = { debug: 0, config: { iceServers: [",
              "  { urls: 'stun:stun.l.google.com:19302' },",
              "  { urls: 'stun:global.stun.twilio.com:3478' }",
              "] } };"
          ])
          g = replace_once(g, "const GLOBAL_HUB_ID = 'bayside-games-global-presence-hub-v1';", "const GLOBAL_HUB_ID = 'bayside-games-global-presence-hub-v1';" + nl + peer_options, 'PeerJS ICE configuration')
          g = replace_once(g, 'new Peer(GLOBAL_HUB_ID, { debug: 0 })', 'new Peer(GLOBAL_HUB_ID, PEER_OPTIONS)', 'hub Peer')
          g = replace_once(g, 'new Peer(undefined, { debug: 0 })', 'new Peer(undefined, PEER_OPTIONS)', 'guest Peer')
          g = replace_once(g, '    this.hubConnection = null;' + nl + '    this.retryTimer = null;', '    this.hubConnection = null;' + nl + '    this.hubConnectTimer = null;' + nl + '    this.hubConnectPending = false;' + nl + '    this.retryTimer = null;', 'presence constructor')
          g = replace_once(g, '    this.hubConnection = null;' + nl + nl + "    peer.on('open'", '    this.hubConnection = null;' + nl + '    this.hubConnectPending = false;' + nl + nl + "    peer.on('open'", 'guest reset')

          method_lines = [
              '  async connectToHub() {',
              '    if (this.closing || this.isHub || !this.peer || !this.selfId || this.peer.destroyed) return;',
              '    // Keep one in-flight attempt: a pending DataConnection is not yet open.',
              '    if (this.hubConnection?.open || this.hubConnectPending) return;',
              "    const conn = this.peer.connect(GLOBAL_HUB_ID, { reliable: true, serialization: 'json' });",
              '    this.hubConnection = conn;',
              '    this.hubConnectPending = true;',
              '    this.hubConnectTimer = setTimeout(() => {',
              '      if (this.closing || this.hubConnection !== conn || conn.open) return;',
              '      this.hubConnection = null;',
              '      this.hubConnectPending = false;',
              '      this.hubConnectTimer = null;',
              '      try { conn.close(); } catch { /* connection already closed */ }',
              "      this.emit('status', 'RETRYING');",
              '      this.scheduleFailover();',
              '    }, 12000);',
              "    conn.on('open', async () => {",
              '      if (this.closing || this.hubConnection !== conn) return;',
              '      clearTimeout(this.hubConnectTimer);',
              '      this.hubConnectTimer = null;',
              '      this.hubConnectPending = false;',
              "      conn.send({ type: 'hello', profile: this.profile, ownerProof: await this.createOwnerProof(this.selfId) });",
              "      this.emit('status', 'CONNECTED');",
              '    });',
              "    conn.on('data', async data => {",
              "      if (!data || typeof data !== 'object') return;",
              "      if (data.type === 'welcome' || data.type === 'roster') await this.applyRoster(data.roster || []);",
              "      if (data.type === 'presence-status') this.emit('status', data.value || 'CONNECTED');",
              '    });',
              '    const disconnected = () => {',
              '      if (this.closing || this.hubConnection !== conn) return;',
              '      clearTimeout(this.hubConnectTimer);',
              '      this.hubConnectTimer = null;',
              '      this.hubConnection = null;',
              '      this.hubConnectPending = false;',
              "      this.emit('status', 'RECONNECTING');",
              '      try { conn.close(); } catch { /* already closed */ }',
              '      this.scheduleFailover();',
              '    };',
              "    conn.on('close', disconnected);",
              "    conn.on('error', disconnected);",
              '  }'
          ]
          a = g.index('  async connectToHub() {')
          b = g.index(nl + '  async getPublicRoster()', a)
          g = g[:a] + nl.join(method_lines) + g[b:]
          g = replace_once(g, '  clearPeer() {' + nl + '    if (this.peer) {', '  clearPeer() {' + nl + '    clearTimeout(this.hubConnectTimer);' + nl + '    this.hubConnectTimer = null;' + nl + '    this.hubConnectPending = false;' + nl + '    if (this.peer) {', 'clearPeer timer cleanup')
          gpath.write_text(g)

          mpath = Path('apex-gp/src/main.js')
          m = mpath.read_text()
          m = replace_once(m, 'input.steerTarget = rawSteer * (autoInput ? 1 : .72);', 'input.steerTarget = rawSteer * (autoInput ? 1 : .60);', 'keyboard steering range')
          m = replace_once(m, 'const steerRate = input.steerTarget === 0 ? 7.5 : (autoInput ? 9 : 5.2);', 'const steerRate = input.steerTarget === 0 ? 6.8 : (autoInput ? 8.5 : 4.1);', 'steering input smoothing')
          angle_start = m.find('const maxSteerAngle = lerp(')
          angle_end = m.find(';', angle_start)
          if angle_start < 0 or angle_end < 0: raise SystemExit('steering angle limit: could not locate steering expression')
          m = m[:angle_start] + 'const maxSteerAngle = lerp(.34, .13, speedRatio);' + m[angle_end + 1:]
          mpath.write_text(m)
          PY
          cat .visual-upgrade-patch/*.b64 | base64 --decode > /tmp/visual-upgrade.patch.gz
          echo "925678dabc5c9e110cfb8e88bdbb8cd8ec965b24f78dc335a90a8e99b116ec8c  /tmp/visual-upgrade.patch.gz" | sha256sum --check
          gzip -d /tmp/visual-upgrade.patch.gz
          patch --batch --forward -p1 < /tmp/visual-upgrade.patch
          cat .leaderboard-room-patch/*.b64 | base64 --decode > /tmp/leaderboard-room.patch.gz
          echo "b2727b09594357ad8392255ec8c4a2073b4fa8078958a0c653b7bd2031271114  /tmp/leaderboard-room.patch.gz" | sha256sum --check
          gzip -d /tmp/leaderboard-room.patch.gz
          patch --batch --forward -p1 < /tmp/leaderboard-room.patch
          cat .ers-tyres-pit-patch/*.b64 | base64 --decode > /tmp/ers-tyres-pit.patch.gz
          echo "f5b1a9332aff52ffe624aa8cfefcbd3a4c7d287188ce8726b983e604e03e1a53  /tmp/ers-tyres-pit.patch.gz" | sha256sum --check
          gzip -d /tmp/ers-tyres-pit.patch.gz
          patch --batch --forward -p1 < /tmp/ers-tyres-pit.patch
          cat .sunny-loader-patch/*.b64 | base64 --decode > /tmp/sunny-loader.patch.gz
          echo "343cc968c6cb8f4d12183d7e1cd45c310514430e67a0a5f794b4299d1529a1b5  /tmp/sunny-loader.patch.gz" | sha256sum --check
          gzip -d /tmp/sunny-loader.patch.gz
          patch --batch --forward -p1 < /tmp/sunny-loader.patch
          cat .supabase-presence-patch/*.b64 | base64 --decode > /tmp/supabase-presence.patch.gz
          echo "000a3ef22639586eb5e8b9bd4bb099ea6903fe963aefb634b69f84986f0b3eae  /tmp/supabase-presence.patch.gz" | sha256sum --check
