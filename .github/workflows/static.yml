# Deploy the updated Monza Apex GP simulator to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Reassemble and verify the Monza simulator
        run: |
          cat .monza-parts/*.bin > /tmp/Apex-GP-Monza.zip
          unzip -tq /tmp/Apex-GP-Monza.zip
          unzip -oq /tmp/Apex-GP-Monza.zip -d .
          rm -rf .monza-parts /tmp/Apex-GP-Monza.zip
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
